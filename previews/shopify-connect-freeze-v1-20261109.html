<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connect your Shopify store — CitMark</title>
<style>
:root{ color-scheme: light dark; --bg:#f4f4f1; --bg-raise:#ffffff; --ink:#141519; --ink-2:#3c4048; --muted:#62666e; --line:#dcdad2; --accent:#e8490f; --bad:#b3261e; --shadow:0 1px 2px rgba(20,21,25,.05),0 12px 32px -12px rgba(20,21,25,.18); }
@media (prefers-color-scheme: dark){ :root{ --bg:#0e1011; --bg-raise:#171a1c; --ink:#f1efe8; --ink-2:#cfd2cd; --muted:#9aa09b; --line:#272c2e; --accent:#ff6a33; --bad:#f0766d; --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.6); } }
*{ box-sizing:border-box; } body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; }
.su-top{ position:sticky; top:0; z-index:40; height:60px; display:flex; align-items:center; padding:0 max(28px,calc((100vw - 1120px)/2)); background:color-mix(in srgb,var(--bg) 88%,transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.wordmark{ font-size:21px; font-weight:800; letter-spacing:-.02em; } .wordmark i{ font-style:normal; color:var(--accent); }
.stage{ max-width:400px; margin:0 auto; padding:40px 16px 64px; }
.auth-card{ width:100%; padding:28px; border-radius:24px; background:color-mix(in srgb,var(--bg) 88%,transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid var(--line); box-shadow:var(--shadow); }
.brand-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.brand-row h3{ font-size:16px; font-weight:700; margin:0; }
.lede{ font-size:13.5px; line-height:19px; color:var(--ink-2); margin:0 0 20px; }
.capsule-field{ position:relative; width:100%; margin:0 auto; }
.capsule-chip{ position:absolute; left:7px; top:50%; transform:translateY(-50%); width:35px; height:35px; border-radius:50%; background:rgba(20,21,25,.06); display:flex; align-items:center; justify-content:center; }
.capsule-field input{ width:100%; min-height:43px; padding:11px 148px 11px 52px; border:1px solid rgba(20,21,25,.12); border-radius:999px; background:rgba(255,255,255,.30); color:var(--ink); font-size:16px; font-weight:500; font-family:inherit; }
.capsule-field input::placeholder{ color:var(--muted); }
.capsule-field input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.suffix{ position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:16px; font-weight:500; color:var(--muted); pointer-events:none; }
.msg{ min-height:18px; font-size:13px; line-height:18px; color:var(--bad); margin:8px 2px 0; }
.cta{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:43px; margin-top:14px; border:0; border-radius:999px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; font-family:inherit; cursor:pointer; }
.cta:active{ transform:scale(.98); }
.foot{ text-align:center; margin-top:20px; font-size:14px; } .foot a{ color:var(--ink-2); text-decoration:none; } .foot a:hover{ text-decoration:underline; }
@media (prefers-color-scheme: dark){ .capsule-chip{ background:rgba(255,255,255,.08); } .capsule-field input{ background:#26282E; border-color:rgba(255,255,255,.28); color:#F4F4F1; } }
</style>
