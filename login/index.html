<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — CitMark</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="2;url=https://citmark.com/?auth=login">
<style>
  :root { --bg: #f4f4f1; --bg-raise: #ffffff; --line: #dcdad2; --ink: #20212a; --muted: #6d6d66; --accent: #e8490f; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .card { background: var(--bg-raise); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: 340px; width: 100%; }
  .wordmark { font-size: 20px; font-weight: 800; margin: 0 0 12px; }
  .wordmark .dot { color: var(--accent); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; padding: 10px 18px; border-radius: 999px; }
</style>
<script>
  window.location.replace("https://citmark.com/?auth=login");
</script>
</head>
<body>
  <main class="card">
    <p class="wordmark">CitMark<span class="dot">.</span></p>
    <h1>Sign in</h1>
    <p>Taking you to the sign-in form…</p>
    <a class="btn" href="https://citmark.com/?auth=login">Continue to sign in</a>
  </main>
</body>
</html>
